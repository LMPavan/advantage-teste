services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: precodepraca
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./db/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql
volumes:
  dados:
